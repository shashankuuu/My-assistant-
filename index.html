<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080812;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  max-height: 850px;
  background: #10101c;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #29293d;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 6px 0 0;
  color: #aaa;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  margin: 12px 0;
  padding: 12px 15px;
  border-radius: 16px;
  max-width: 85%;
  line-height: 1.5;
  font-size: 17px;
}

.assistant {
  background: #202035;
  margin-right: auto;
}

.user {
  background: #6c4cff;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 14px;
  border-top: 1px solid #29293d;
  background: #10101c;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 0;
  outline: none;
  border-radius: 30px;
  background: #202035;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #999;
}

button {
  border: 0;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  background: #6c4cff;
  color: white;
  font-size: 21px;
  cursor: pointer;
}

button:active {
  transform: scale(0.92);
}

.mic {
  background: #33334c;
}

.listening {
  background: #ff416c;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🤖 My Assistant</h1>
  <p>I'm here to listen.</p>
</header>

<div id="chat">

  <div class="message assistant">
    Hey! 👋 I'm your personal assistant.
    You can type or talk to me. ❤️
  </div>

</div>

<div class="input-area">

  <button
    id="micButton"
    class="mic"
    onclick="startVoice()">
    🎤
  </button>

  <input
    id="messageInput"
    type="text"
    placeholder="Type something..."
    onkeydown="handleEnter(event)"
  >

  <button onclick="sendMessage()">
    ➤
  </button>

</div>

</div>

<script>

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const micButton = document.getElementById("micButton");


// ===============================
// TEXT MESSAGE
// ===============================

function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");

  input.value = "";

  setTimeout(() => {

    addMessage(
      "I'm listening. Tell me more about what's on your mind. ❤️",
      "assistant"
    );

  }, 500);
}


// ===============================
// ADD MESSAGE
// ===============================

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


// ===============================
// ENTER KEY
// ===============================

function handleEnter(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

}


// ===============================
// VOICE RECOGNITION
// ===============================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = function() {

    micButton.classList.add("listening");

    micButton.textContent = "🔴";

  };


  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    micButton.classList.remove("listening");

    micButton.textContent = "🎤";

    // Automatically send voice message
    sendMessage();

  };


  recognition.onerror = function() {

    micButton.classList.remove("listening");

    micButton.textContent = "🎤";

    alert("Mic permission ya speech recognition available nahi hai.");

  };


  recognition.onend = function() {

    micButton.classList.remove("listening");

    micButton.textContent = "🎤";

  };

}


// ===============================
// START VOICE
// ===============================

function startVoice() {

  if (!recognition) {

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;
  }

  recognition.start();

}

</script>

</body>
</html>
